[package]
name = "portfolio-sidekick"
version = "1.7.34"
description = "Portfolio Sidekick — secure local Robinhood portfolio toolkit"
authors = ["Roy Dawson IV"]
license = "MIT"
repository = "https://github.com/ImYourBoyRoy/PortfolioSidekick"
edition = "2024"
rust-version = "1.96"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = ">=2", features = [] }

[dependencies]
serde_json = ">=1"
serde = { version = ">=1", features = ["derive"] }
log = ">=0.4"
reqwest = { version = ">=0.13", default-features = false, features = ["cookies", "json", "rustls", "form"] }
tokio = { version = ">=1", features = ["time"] }
aes-gcm = ">=0.10"
rand = ">=0.10"
tauri = { version = ">=2", features = [] }
tauri-plugin-log = ">=2"
tauri-plugin-fs = ">=2"
tauri-plugin-http = ">=2"
tauri-utils = ">=2"

# time 0.3.48+ conflicts with blanket `From` impls in tauri-utils/cookie (time-rs/time#783).
# Patch upstream fixes until crates.io releases land (tauri-apps/tauri#15525, rwf2/cookie-rs#254).
[patch.crates-io]
cookie = { git = "https://github.com/rwf2/cookie-rs", rev = "33a6c47bfa3749d6638b90e6ced5743e02fb9db1" }
tauri-utils = { path = "patches/tauri-utils" }
tauri = { path = "patches/tauri" }
