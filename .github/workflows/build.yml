name: Compile & Package Multi-Platform Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-desktop:
    name: Build Desktop Release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm install
          npm run lint
          npm run build

      - name: Install Backend & PyInstaller
        run: |
          pip install -r backend/requirements.txt
          pip install pyinstaller Pillow

      - name: Run PyInstaller Bundle
        run: |
          pyinstaller --clean PortfolioSidekick.spec

      - name: Package Windows Binary
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Copy-Item dist/PortfolioSidekick.exe ./PortfolioSidekick-Windows.exe

      - name: Package macOS App Bundle
        if: matrix.os == 'macos-latest'
        run: |
          if [ -d "dist/PortfolioSidekick.app" ]; then
            zip -r ./PortfolioSidekick-MacOS.zip dist/PortfolioSidekick.app
          else
            zip -r ./PortfolioSidekick-MacOS.zip dist/PortfolioSidekick
          fi

      - name: Package Linux Binary
        if: matrix.os == 'ubuntu-latest'
        run: |
          cp dist/PortfolioSidekick ./PortfolioSidekick-Linux
          tar -czvf ./PortfolioSidekick-Linux.tar.gz PortfolioSidekick-Linux

      - name: Upload Windows Artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-latest
          path: PortfolioSidekick-Windows.exe

      - name: Upload macOS Artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-latest
          path: PortfolioSidekick-MacOS.zip

      - name: Upload Linux Artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-ubuntu-latest
          path: PortfolioSidekick-Linux.tar.gz

  build-android:
    name: Build Android Mobile APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Frontend Dependencies & Build React App
        run: |
          cd frontend
          npm install
          npm run lint
          npm run build

      - name: Initialize Capacitor Android Platform
        run: |
          cd frontend
          npx cap sync
          npx cap add android || echo "Android platform already added"
          npx cap sync android

      - name: Inject Custom Android Launcher Icons
        run: |
          # Create and configure all target res folders in native Android
          mkdir -p frontend/android/app/src/main/res/mipmap-mdpi
          mkdir -p frontend/android/app/src/main/res/mipmap-hdpi
          mkdir -p frontend/android/app/src/main/res/mipmap-xhdpi
          mkdir -p frontend/android/app/src/main/res/mipmap-xxhdpi
          mkdir -p frontend/android/app/src/main/res/mipmap-xxxhdpi
          
          # 1. Standard/legacy PNG launcher icons
          cp assets/android/icon-mdpi.png frontend/android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp assets/android/icon-mdpi.png frontend/android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp assets/android/icon-hdpi.png frontend/android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp assets/android/icon-hdpi.png frontend/android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp assets/android/icon-xhdpi.png frontend/android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp assets/android/icon-xhdpi.png frontend/android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp assets/android/icon-xxhdpi.png frontend/android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp assets/android/icon-xxhdpi.png frontend/android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp assets/android/icon-xxxhdpi.png frontend/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp assets/android/icon-xxxhdpi.png frontend/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          
          # 2. Premium adaptive foreground launcher icons
          cp assets/android/icon-foreground-mdpi.png frontend/android/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png
          cp assets/android/icon-foreground-hdpi.png frontend/android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png
          cp assets/android/icon-foreground-xhdpi.png frontend/android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png
          cp assets/android/icon-foreground-xxhdpi.png frontend/android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png
          cp assets/android/icon-foreground-xxxhdpi.png frontend/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          
          # 3. Create/overwrite adaptive XML files for proper circle/square shape resolution on SDK 26+
          mkdir -p frontend/android/app/src/main/res/mipmap-anydpi-v26
          
          cat << 'EOF' > frontend/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          
          cat << 'EOF' > frontend/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          
          # 4. Inject color hex matching our gorgeous premium brand color (#070c12) to override white background
          mkdir -p frontend/android/app/src/main/res/values
          # Delete any previous colors.xml or background duplicates to prevent Gradle merger conflict
          rm -f frontend/android/app/src/main/res/values/colors.xml
          rm -f frontend/android/app/src/main/res/values/ic_launcher_background.xml
          
          cat << 'EOF' > frontend/android/app/src/main/res/values/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#070c12</color>
          </resources>
          EOF

      - name: Inject Native Robinhood Plugin & Security Hardening
        run: |
          set -e
          PKG_DIR="frontend/android/app/src/main/java/com/imyourboyroy/portfoliosidekick"
          mkdir -p "$PKG_DIR"
          mkdir -p frontend/android/app/src/main/res/xml
          cp frontend/native/android/*.kt "$PKG_DIR/"
          cp frontend/native/android/network_security_config.xml frontend/android/app/src/main/res/xml/network_security_config.xml

          # Enable Kotlin in the app module (Capacitor's template is Java-only by default,
          # so the .kt native plugin would not compile without this).
          PROJECT_GRADLE="frontend/android/build.gradle"
          if ! grep -q "kotlin-gradle-plugin" "$PROJECT_GRADLE"; then
            sed -i "/classpath 'com.android.tools.build:gradle/a\        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25'" "$PROJECT_GRADLE"
          fi

          APP_GRADLE="frontend/android/app/build.gradle"
          if ! grep -q "kotlin-android" "$APP_GRADLE"; then
            sed -i "1a apply plugin: 'kotlin-android'" "$APP_GRADLE"
          fi

          # Gradle dependencies for OkHttp + EncryptedSharedPreferences + Kotlin stdlib
          if ! grep -q "security-crypto" "$APP_GRADLE"; then
            sed -i '/dependencies {/a\    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.25"\n    implementation "com.squareup.okhttp3:okhttp:4.12.0"\n    implementation "androidx.security:security-crypto:1.1.0-alpha06"' "$APP_GRADLE"
          fi

          # Register the native plugin in MainActivity (Capacitor does not auto-register
          # plugins defined inside the app module — they must be registered explicitly).
          cat > "$PKG_DIR/MainActivity.java" <<'JAVA'
          package com.imyourboyroy.portfoliosidekick;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(RobinhoodSessionPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA

          # AndroidManifest: disable backup + network allowlist.
          # Set the existing allowBackup attribute (avoid duplicating it) and add the
          # network security config + fullBackupContent only if not already present.
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("frontend/android/app/src/main/AndroidManifest.xml")
          text = p.read_text()
          text = text.replace('android:allowBackup="true"', 'android:allowBackup="false"')
          if 'networkSecurityConfig' not in text:
              text = text.replace(
                  "<application",
                  '<application android:networkSecurityConfig="@xml/network_security_config" android:fullBackupContent="false"',
                  1,
              )
          p.write_text(text)
          PY

      - name: Compile Android APK via Gradle
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Copy & Name APK
        run: |
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk ./PortfolioSidekick-Android.apk

      - name: Upload Mobile APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-apk
          path: PortfolioSidekick-Android.apk

  publish-releases:
    name: Publish Assets to GitHub Release
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/PortfolioSidekick-Windows.exe
            release-assets/PortfolioSidekick-MacOS.zip
            release-assets/PortfolioSidekick-Linux.tar.gz
            release-assets/PortfolioSidekick-Android.apk
          name: Portfolio Sidekick Release ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
