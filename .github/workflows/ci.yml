# PR smoke tests — gates merges to protected main (see build.yml for release tags).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sidekick-smoke:
    name: Lint, build, toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: sidekick/.node-version
          check-latest: true
          cache: npm
          cache-dependency-path: sidekick/package-lock.json

      - name: Verify toolchain policy
        run: node sidekick/scripts/upgrade-ci-toolchain.mjs --check

      - name: Install and verify sidekick
        run: |
          cd sidekick
          npm ci
          npm run dedupe:domains
          npm run lint
          npm run test
          npm run build

  tauri-check:
    name: Rust compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: sidekick/src-tauri -> sidekick/src-tauri/target

      - name: cargo check
        run: cargo check
        working-directory: sidekick/src-tauri
