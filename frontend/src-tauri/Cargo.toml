[package]
name = "portfolio-sidekick"
version = "1.7.21"
description = "Portfolio Sidekick — secure local Robinhood portfolio toolkit"
authors = ["Roy Dawson IV"]
license = "MIT"
repository = "https://github.com/ImYourBoyRoy/PortfolioSidekick"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls"] }
tokio = { version = "1", features = ["time"] }
aes-gcm = "0.10"
rand = "0.8"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
